<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f5fb">
  <title>歌词库 · Kikoeta-LLS</title>
  <link rel="icon" href="/logo.png">
  <link rel="stylesheet" href="/style.css">
  <script defer src="/shared.js"></script>
  <script defer src="/library.js"></script>
</head>
<body data-view="library">
  <div class="app-shell">
    <aside class="rail" aria-label="导航">
      <a class="rail-brand" href="/library" aria-label="Kikoeta-LLS 首页"><img src="/logo.png" alt=""></a>
      <a id="nav-library" class="rail-item rail-current" href="/library" aria-current="page"><span class="rail-icon" aria-hidden="true">♫</span><span>歌词库</span></a>
      <a id="nav-settings" class="rail-item" href="/settings"><span class="rail-icon" aria-hidden="true">⚙</span><span>设置</span></a>
      <a class="rail-source" href="https://github.com/chenflxs/kikoeta-LLS" target="_blank" rel="noopener noreferrer" title="获取源代码">源码</a>
    </aside>

    <div class="main-column">
      <header class="topbar">
        <div class="topbar-title"><span class="eyebrow">KIKOETA / LYRICS LIBRARY</span><h1>歌词库</h1></div>
        <div class="header-actions">
          <span class="service-pill"><span class="online-dot"></span>远程服务</span>
          <button id="theme-toggle" class="icon-button" type="button" aria-label="切换主题" title="切换主题">☾</button>
          <button id="logout" class="quiet-button" type="button">退出登录</button>
        </div>
      </header>

      <main class="content">
        <p id="message" class="message" role="status" aria-live="polite"></p>

        <div id="library-panel">
          <section class="overview">
            <div><span class="eyebrow">LIBRARY SERVICE</span><h2>远程歌词库</h2><p>管理并广播本地歌词，供 Kikoeta 设备访问。</p></div>
            <div class="overview-stats" aria-label="歌词库统计">
              <div><strong id="work-count">0</strong><span>作品</span></div>
              <div><strong id="file-count">0</strong><span>歌词文件</span></div>
            </div>
          </section>

          <div class="library-layout">
            <section class="surface upload-surface">
              <div class="section-head upload-heading"><span class="section-icon" aria-hidden="true">＋</span><div><h2>导入歌词</h2><p id="import-mode-description">上传文件到指定作品</p></div><div class="import-switch" role="group" aria-label="导入方式"><button id="mode-lyrics" type="button" class="active" aria-pressed="true">歌词</button><button id="mode-zip" type="button" aria-pressed="false">压缩包</button></div></div>
              <form id="upload-form">
                <label>作品号<input name="workId" placeholder="例如 RJ123456" required pattern="[RrVvBb][Jj][0-9]+" autocomplete="off"></label>
                <label><span>子目录 <span class="optional">可选</span></span><input name="prefix" placeholder="例如 disc1" autocomplete="off"></label>
                <label>选择歌词文件<input name="files" type="file" accept=".lrc,.txt,.srt,.vtt,.ass,.ssa" multiple required></label>
                <p class="field-help">支持 LRC、TXT、SRT、VTT、ASS、SSA；单文件最大 8 MiB。</p>
                <label class="check"><input name="isAi" type="checkbox"> 标记为 AI 歌词</label>
                <button class="primary-button" type="submit">上传到歌词库</button>
              </form>
              <form id="zip-form" hidden>
                <label>选择压缩包<input name="archive" type="file" accept=".zip,application/zip" multiple required></label>
                <p class="field-help">自动识别 RJ、VJ、BJ 作品目录及内嵌 ZIP；单包最大 512 MiB。</p>
                <div class="zip-conflict-field"><span id="zip-conflict-caption">已有同名歌词</span><div id="zip-conflict-select" class="zip-conflict-select">
                  <select name="conflict" tabindex="-1" aria-hidden="true" hidden><option value="follow">跟随设置（默认）</option><option value="skip">跳过已有文件</option><option value="overwrite">覆盖已有文件</option></select>
                  <button id="zip-conflict-trigger" class="zip-conflict-trigger" type="button" aria-labelledby="zip-conflict-caption zip-conflict-value" aria-haspopup="listbox" aria-expanded="false" aria-controls="zip-conflict-menu"><span id="zip-conflict-value">跟随设置（默认）</span><span class="select-chevron" aria-hidden="true"></span></button>
                  <div id="zip-conflict-menu" class="zip-conflict-menu" role="listbox" aria-label="已有同名歌词处理方式" hidden>
                    <button type="button" role="option" data-value="follow" aria-selected="true"><span>跟随设置</span><small>使用设置中的处理方式</small></button>
                    <button type="button" role="option" data-value="skip" aria-selected="false"><span>跳过已有文件</span><small>保留歌词库中的现有文件</small></button>
                    <button type="button" role="option" data-value="overwrite" aria-selected="false"><span>覆盖已有文件</span><small>用压缩包中的歌词替换现有文件</small></button>
                  </div>
                </div></div>
                <label class="check"><input name="isAi" type="checkbox"> 导入的歌词标记为 AI</label>
                <button class="primary-button" type="submit">批量导入</button>
              </form>
              <div id="zip-progress" class="import-progress" role="status" aria-live="polite" hidden>
                <strong id="zip-progress-title"></strong>
                <progress id="zip-progress-bar" max="100"></progress>
                <span id="zip-progress-detail"></span>
              </div>
            </section>

            <section class="surface works-surface">
              <div class="section-head works-heading"><span class="section-icon" aria-hidden="true">♫</span><div><h2>作品列表</h2><p>查看歌词文件与 AI 标记</p></div><button id="refresh" class="quiet-button" type="button">刷新</button></div>
              <div class="search-row"><label class="search-field"><span aria-hidden="true">⌕</span><input id="work-search" type="search" maxlength="128" placeholder="搜索作品号前缀或文件路径" aria-label="搜索作品号前缀或文件路径"></label><span id="visible-count" class="count-pill">0 部作品</span></div>
              <div id="works" class="works-list"></div>
              <div id="list-status" class="list-status" role="status" aria-live="polite" hidden></div>
            </section>
          </div>
        </div>

      </main>
    </div>
  </div>
</body>
</html>
